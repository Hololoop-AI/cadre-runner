# Cadre — local runner config
# Copy to config.toml (same dir) or pass --config. Paths may use ~.

[runner]
poll_interval = 45                                  # longest gap between daemon passes (work wakes it sooner)
data_dir = "~/.local/state/pipeline-runner"         # registry, board, pages, logs
skills_source = "~/dev-config/ai-workflow-config/skills"  # skills linked into a turn's directory
status_bind = "0.0.0.0"            # statusd.py: bind address (tailnet default) and port;
status_port = 8181                 # CADRE_STATUS_BIND / CADRE_STATUS_PORT override
                                   # several addresses: ["127.0.0.1", "100.x.y.z"]
# allowed_hosts = ["box.tailnet.ts.net"]  # names other machines reach this page by;
                                   # default: worked out from the bind + `tailscale status`
# machine_name = "fedora-1"        # what other fleets call this machine; default: tailnet name

# Other machines' Cadre backends shown on this fleet page, each read through
# its /api/fleet (docs/DIALOGUE-SETUP.md, "More than one machine").
# [[backends]]
# name = "fedora-1 · shared team backend"
# url = "http://fedora-1.tail2057e0.ts.net:8183"

[claude]
bin = "claude"
effort = "high"
# Autonomy requires no permission prompts. "bypass" = --dangerously-skip-permissions,
# confined to the runner-owned checkout by convention (not enforcement). Anything else
# is passed through as --permission-mode <value> (runs may then block on prompts).
permission_mode = "bypass"
timeout_seconds = 0              # per-turn wall-clock ceiling in seconds; 0 = none
# Models are ALWAYS passed explicitly (sessions must not inherit the laptop default).
default_model = "opus"

# Model and effort per node, overriding the defaults above. Model and effort
# are one choice, not two: a strong model at low effort and a weaker one at
# high effort can cost about the same per task, so the interesting comparisons
# are pairs. Unlisted nodes take the global default.
[claude.stage_models]
# implement = "sonnet"

[claude.stage_effort]
# tutor = "medium"

[limits]
max_rounds_per_stage = 5           # dialogue rounds offered, and agent-to-agent handoffs per task
