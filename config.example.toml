# PR-gated pipeline — local runner config
# Copy to config.toml (same dir) or pass --config. Paths may use ~.

[runner]
poll_interval = 45                                  # seconds between poll passes
data_dir = "~/.local/state/pipeline-runner"         # registry, etags, checkouts, logs
skills_source = "~/dev-config/ai-workflow-config/skills"  # where `install` links skills from

[claude]
bin = "claude"
effort = "high"
# Autonomy requires no permission prompts. "bypass" = --dangerously-skip-permissions,
# confined to the runner-owned checkout by convention (not enforcement). Anything else
# is passed through as --permission-mode <value> (runs may then block on prompts).
permission_mode = "bypass"
timeout_seconds = 7200
# Models are ALWAYS passed explicitly (sessions must not inherit the laptop default).
default_model = "opus"

[claude.stage_models]
intake = "opus"
interrogate = "opus"
contracts = "opus"
tests = "sonnet"
build = "sonnet"
revise = "sonnet"

# Effort per stage, overriding [claude].effort. Model and effort are one
# choice, not two: a strong model at low effort and a weaker one at high effort
# can cost about the same per task, so the interesting comparisons are pairs.
# Unlisted stages take the global default.
[claude.stage_effort]
# build = "low"        # strong model, brief thinking — the locked tests steer it
# interrogate = "max"  # where finding the flaw is the whole job

[limits]
max_rounds_per_stage = 5           # interrogate rounds / revise rounds per PR before escalation
allowed_actors = ["BrandonPerez-Dev"]  # GitHub logins whose comments/merges are honored

# One [[repos]] block per target repo the runner may operate on.
[[repos]]
name = "BrandonPerez-Dev/pipeline-sandbox"   # owner/repo on GitHub
variant = "change-spec"                      # "change-spec" | "spec-as-source"
default_branch = "main"
# checkout is optional; defaults to <data_dir>/checkouts/<repo-name>

# Board-driven intake (optional): watch a tracker column, auto-start stories,
# mirror status back to the card. Trigger is a configurable predicate — the
# work/Jira version is the same shape with different conditions.
# [intake]
# provider = "linear"
# repo = "owner/name"              # repo triggered stories run against
# variant = "change-spec"          # optional; else the repo's default
# [intake.linear]
# api_key_env = "LINEAR_API_KEY"   # key lives in ~/.config/cadre/env
# team = "Nexusdev"                # team name or key
# trigger_state = "cadre"          # the column that means "go"
# require_labels = []              # extra conditions, all must pass
# exclude_labels = []              # e.g. ["spike"]
# assignee = ""                    # "" = anyone
