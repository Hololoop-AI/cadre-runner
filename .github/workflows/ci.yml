name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: No deployment details in the repo
        run: python -m pytest -q tests/test_no_deployment_details.py
      - name: Test suite
        run: python -m pytest -q
